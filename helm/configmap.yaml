apiVersion: v1
kind: ConfigMap
metadata:
  name: spring-latest-ref-config
  labels:
    app: spring-latest-ref
data:
  application.properties: |
    management.metrics.export.otlp.enabled=false
    # Tracing export (Micrometer -> OTLP). Enable export to in-cluster Jaeger collector (HTTP 4318).
    # Note: Ensure Jaeger is deployed first: kubectl apply -f helm/jaeger.yaml
    management.otlp.tracing.endpoint=http://jaeger:4318/v1/traces
    # Sampling probability (0.0 = off, 1.0 = sample all). Keep low in production.
    management.tracing.sampling.probability=1.0
    # Add JDBC SQL statements to tracing spans (Hibernate StatementInspector)
    spring.jpa.properties.hibernate.session_factory.statement_inspector=com.lorman.ref.spring.observation.SqlTracingStatementInspector
    # Zapne JSON logovanie v prostredí Kubernetes (nadstaví Logback konfiguráciu)
    logging.config=/etc/spring-latest-ref-config/logback-json.xml
    # Enable dedicated Kubernetes probe endpoints
    management.endpoint.health.probes.enabled=true
    management.endpoints.web.exposure.include=health,info
    # Make readiness independent from Kafka by default (can be re-enabled later)
    management.health.kafka.enabled=false
    # Enable Micrometer Observation for Kafka so produce/consume appear as spans in Jaeger
    spring.kafka.producer.observation-enabled=true
    spring.kafka.consumer.observation-enabled=true
    spring.kafka.listener.observation-enabled=true
    spring.kafka.template.observation-enabled=true
  logback-json.xml: |
    <?xml version="1.0" encoding="UTF-8"?>
    <configuration>
        <!-- JSON konzolový appender cez Logstash encoder -->
        <appender name="JSON_CONSOLE" class="ch.qos.logback.core.ConsoleAppender">
            <encoder class="net.logstash.logback.encoder.LogstashEncoder">
                <!-- Premenujeme niektoré polia na jednoduchšie názvy -->
                <fieldNames>
                    <timestamp>timestamp</timestamp>
                    <level>level</level>
                    <thread>thread</thread>
                    <logger>logger</logger>
                    <formattedMessage>message</formattedMessage>
                </fieldNames>
                <!-- Zahrni MDC (napr. traceId, spanId z Micrometer tracing) -->
                <includeMdc>true</includeMdc>
            </encoder>
        </appender>
        
        <root level="INFO">
            <appender-ref ref="JSON_CONSOLE"/>
        </root>
    </configuration>
