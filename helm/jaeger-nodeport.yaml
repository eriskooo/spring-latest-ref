apiVersion: v1
kind: Service
metadata:
  name: jaeger-nodeport
  labels:
    app: jaeger
  annotations:
    # Optional: keep NodePort explicit for predictable local access
    # You can remove nodePort fields to let the cluster assign random ports
    description: "NodePort service to access Jaeger UI locally without port-forward"
spec:
  type: NodePort
  selector:
    app: jaeger
  ports:
    - name: ui
      port: 16686
      targetPort: 16686
      nodePort: 31686
    # Uncomment if you want to ingest OTLP HTTP from outside the cluster
    # - name: otlp-http
    #   port: 4318
    #   targetPort: 4318
    #   nodePort: 30418
