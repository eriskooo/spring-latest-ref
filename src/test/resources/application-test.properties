#############################################
# Test-specific overrides for Circuit Breaker
# Use small windows and short wait durations
#############################################
# Keep server off for unit-style tests
server.port=0
# Dummy client config (not used when DummyClient is mocked)
dummy.client.url=http://localhost
dummy.client.port=8080
# Resilience4j Circuit Breaker instance used by @CircuitBreaker(name="dummyClient")
resilience4j.circuitbreaker.instances.dummyClient.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.dummyClient.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.dummyClient.slidingWindowSize=4
resilience4j.circuitbreaker.instances.dummyClient.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.dummyClient.permittedNumberOfCallsInHalfOpenState=1
resilience4j.circuitbreaker.instances.dummyClient.waitDurationInOpenState=1s
resilience4j.circuitbreaker.instances.dummyClient.failureRateThreshold=50
resilience4j.circuitbreaker.instances.dummyClient.automaticTransitionFromOpenToHalfOpenEnabled=true
