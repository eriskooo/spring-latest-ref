spring.application.name=spring-latest-ref
# JDBC datasource (H2 in-memory)
spring.datasource.url=jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
# R2DBC datasource (H2 in-memory)
spring.r2dbc.url=r2dbc:h2:mem:///appdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.r2dbc.username=sa
spring.r2dbc.password=
# Flyway uses JDBC to the same in-memory DB
spring.flyway.enabled=true
spring.flyway.url=jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.flyway.user=sa
spring.flyway.password=
# H2 console (JDBC only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
# Web server
server.port=8080
# Graceful shutdown (Spring Boot 3+)
# Stop accepting new requests and wait for in-flight requests to complete
server.shutdown=graceful
# Total time allowed for all shutdown phases (align with K8s terminationGracePeriodSeconds)
spring.lifecycle.timeout-per-shutdown-phase=30s
# application-local.properties
management.metrics.export.otlp.enabled=false
# Dummy client configuration
# Base URL and port for calling the /dummy endpoint via DummyClient
dummy.client.url=http://localhost
# Default port for DummyClient. Set to 8080 by default; use 0 if you want to resolve current server port dynamically.
dummy.client.port=8080
# --- Kafka (optional) ---
# Feature flag for built-in demo producer/consumer. Disabled by default to avoid requiring a broker.
kafka.enabled=false
# When enabling, configure your broker(s):
# spring.kafka.bootstrap-servers=localhost:9092
# Optionally set consumer group id (defaults used in code if not set):
# spring.kafka.consumer.group-id=spring-latest-ref-group
# Use JSON serdes for DTO messages
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
# Trust our package and set default value type so headers are not required
spring.kafka.consumer.properties.spring.json.trusted.packages=com.lorman.ref.spring.kafka
#spring.kafka.consumer.properties.spring.json.value.default.type=com.lorman.ref.spring.kafka.KafkaMessageDTO
# --- Security (JWT) ---
# Simple symmetric key for demo/dev/tests. Override in production via env var: SECURITY_JWT_SECRET
security.jwt.secret=dev-test-secret-change-me-please-32b

